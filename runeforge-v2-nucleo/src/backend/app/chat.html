<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Simple</title>
    <style>
        body {
            background: #0D0211;
            color: #E2D6EE;
            font-family: monospace;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #39FF14; }
        .chat-box {
            background: #15051C;
            border: 1px solid #BD00FF;
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .msg {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .user {
            background: rgba(57, 255, 20, 0.2);
            border: 1px solid #39FF14;
            text-align: right;
        }
        .bot {
            background: rgba(189, 0, 255, 0.2);
            border: 1px solid #BD00FF;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: #0D0211;
            border: 1px solid #39FF14;
            padding: 10px;
            border-radius: 6px;
            color: #E2D6EE;
        }
        button {
            background: #39FF14;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            color: #0D0211;
            cursor: pointer;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <h1>💬 Chat Simple</h1>
    <div id="messages" class="chat-box"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Escribe tu mensaje..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">Enviar</button>
    </div>
    <script>
        const msgBox = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');

        function addMsg(text, sender) {
            const div = document.createElement('div');
            div.className = 'msg ' + sender;
            div.textContent = text;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        async function sendMsg() {
            const text = msgInput.value.trim();
            if (!text) return;
            addMsg(text, 'user');
            msgInput.value = '';
            addMsg('... Pensando ...', 'bot');
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                const loadingMsg = msgBox.lastElementChild;
                if (loadingMsg.textContent === '... Pensando ...') loadingMsg.remove();
                addMsg(data.response || 'Sin respuesta', 'bot');
            } catch (e) {
                msgBox.lastElementChild.remove();
                addMsg('Error: ' + e.message, 'bot');
            }
        }
    </script>
</body>
</html>
