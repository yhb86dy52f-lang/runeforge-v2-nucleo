<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Runeforge Cockpit</title>
    <style>
        :root{--bg:#07000b;--card:#15051f;--line:#3a174a;--text:#f6eaff;--green:#39ff14;--purple:#8b5cf6}
        body{margin:0;background:radial-gradient(circle at top,#1a0624,#07000b 55%);color:var(--text);font-family:system-ui}
        main{max-width:1180px;margin:auto;padding:24px}
        .card{border:1px solid var(--line);border-radius:18px;background:rgba(16,3,22,.92);padding:16px;margin-bottom:14px}
        .status{font-family:monospace;color:var(--green);font-size:13px}
        button{background:var(--purple);color:white;border:0;border-radius:10px;padding:10px;cursor:pointer;font-weight:bold}
        pre{background:#050007;padding:12px;border-radius:10px;overflow:auto}
    </style>
</head>
<body>
    <main>
        <section class="card">
            <h1>RUNEFORGE COCKPIT V2.5</h1>
            <div class="status" id="boot">ESTADO: Cargando núcleo...</div>
        </section>
        <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
            <div class="card"><h2>Local AI</h2><textarea id="p" style="width:100%;height:80px;background:#000;color:white;border:1px solid #3a174a;border-radius:8px"></textarea><br><button onclick="ask()">Consultar</button></div>
            <div class="card"><h2>System</h2><button onclick="check()">Health Check</button><div id="dash" class="status"></div></div>
        </section>
        <section class="card"><h2>Salida</h2><pre id="out">Esperando comando...</pre></section>
    </main>
    <script>
        const out=document.getElementById("out");
        async function check(){const r=await fetch("/health");const j=await r.json();document.getElementById("dash").textContent="Backend: "+(j.ok?"ONLINE":"FAIL")}
        async function ask(){const m=document.getElementById("p").value; out.textContent="Procesando..."; const r=await fetch("/api/ai/local/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,model:"qwen2.5:1.5b"})}); const j=await r.json(); out.textContent=JSON.stringify(j.response||j,null,2)}
        document.getElementById("boot").textContent="ESTADO: NÚCLEO SOBERANO ACTIVO";
        check();
    </script>
</body>
</html>
