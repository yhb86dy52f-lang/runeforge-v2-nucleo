<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>RUNE MULTI LAN</title><script src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'></script>
<style>body{background:#0a0a0a;color:#0f0;font-family:monospace;padding:20px;text-align:center} #qrcode{display:flex;justify-content:center;margin:20px} .card{border:1px solid #0f0;padding:15px;margin:10px auto;max-width:400px}</style>
</head><body>
<h1>RUNEForge v2.5 MULTI LAN</h1>
<div class='card'><div id='ip'></div><div id='qrcode'></div><div id='status'>Detectando IP LAN...</div></div>
<div class='card'><input id='name' placeholder='Tu nombre'><button onclick='join()'>UNIRME OFFLINE</button><div id='out'></div></div>
<script type='module'>
import { saveOffline, syncNow } from './js/idb-sync.js';
window.saveOffline=saveOffline;
async function init(){
  const res=await fetch('/api/network').then(r=>r.json()).catch(()=>({wifi:'192.168.100.12',tailscale:'100.111.32.10'}));
  const ip=res.wifi||'192.168.100.12';
  document.getElementById('ip').innerText='LAN: http://'+ip+':3100';
  new QRCode(document.getElementById('qrcode'), 'http://'+ip+':3100/acceso-multi.html');
  document.getElementById('status').innerText='Sin internet? Conectate al WiFi y abre el QR - 100% offline';
}
async function join(){
  const name=document.getElementById('name').value||'anon';
  let deviceId=localStorage.getItem('rf_device'); if(!deviceId){deviceId=Math.random().toString(36).slice(2); localStorage.setItem('rf_device',deviceId);}
  try{
    const r=await fetch('/api/multiuser/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,deviceId})});
    const d=await r.json();
    document.getElementById('out').innerText='Conectado como '+name+' ID:'+d.id;
    saveOffline('join',{name});
  }catch(e){ saveOffline('join',{name}); document.getElementById('out').innerText='Guardado OFFLINE, se sincronizara al volver al WiFi'; }
}
window.join=join; init();
</script>
</body></html>
