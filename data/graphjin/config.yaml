name: runeforge-db
database:
  type: sqlite
  url: sqlite://C:\RUNEFORGE_V2_CORE\data\runeforge.db
  read_only: true
server:
  port: 8080
  host: 0.0.0.0
  mcp:
    enabled: true
    read_only: true
    tools: ["query","schema","explain"]
rbac:
  allow:
    - role: llm
      actions: ["query","read"]
      tables: ["*"]
      deny_mutations: true
