[package]
name = "__APP_NAME__"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "__LIB_NAME__"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
codegen-units = 16

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = true
