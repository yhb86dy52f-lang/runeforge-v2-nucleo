<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runeforge</title>
<style>
body{background:#0b0f14;color:#e6edf3;font-family:Segoe UI;margin:0}
.wrap{max-width:800px;margin:auto;padding:30px}
h1{margin-bottom:20px}
.box{background:#111821;padding:20px;border-radius:10px}
input{width:100%;padding:12px;border-radius:8px;border:none;margin-bottom:10px}
button{padding:10px 15px;border:none;border-radius:8px;background:#7c3aed;color:white;cursor:pointer}
pre{background:#000;padding:15px;border-radius:10px;margin-top:15px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
<h1>⚙️ Runeforge</h1>
<div class="box">
<input id="msg" placeholder="Escribe aquí..." />
<button onclick="send()">Enviar</button>
<pre id="out">Esperando...</pre>
</div>
</div>
<script>
async function send(){
  const msg = document.getElementById('msg').value;
  if(!msg) return;
  document.getElementById('out').textContent = 'Enviando...';
  try {
    const res = await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg})
    });
    const data = await res.json();
    document.getElementById('out').textContent = JSON.stringify(data,null,2);
  } catch(e) {
    document.getElementById('out').textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
