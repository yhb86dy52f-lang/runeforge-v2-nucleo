<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>RUNE v2.5 OFFLINE IA MODERADA</title>
<style>body{background:#0a0a0a;color:#0f0;font-family:monospace;padding:15px} #log{border:1px solid #0f0;height:300px;overflow:auto;padding:10px;margin:10px 0}.online{color:#0f0}.offline{color:#ff0} input{width:70%;background:#111;color:#0f0;border:1px solid #0f0;padding:10px} button{background:#0f0;color:#000;padding:10px;border:0}</style>
<script type="importmap">{"imports":{"@mlc-ai/web-llm":"https://esm.run/@mlc-ai/web-llm"}}</script>
</head><body>
<h2>RUNEForge v2.5 - IA Moderada Offline</h2>
<div id="status">Detectando...</div>
<div id="log"></div>
<input id="msg" placeholder="Escribe aunque no tengas datos..."><button onclick="send()">ENVIAR</button>

<script type="module">
import { CreateMLCEngine } from "@mlc-ai/web-llm";
let mode='checking', engine=null, ryzenIP='100.111.32.10';
const logEl=document.getElementById('log'), statusEl=document.getElementById('status');

function log(t,cls=''){ const d=document.createElement('div'); d.className=cls; d.textContent='['+new Date().toLocaleTimeString()+'] '+t; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }

async function checkRyzen(){
  try{
    const r=await fetch('http://'+ryzenIP+':3100/api/network',{signal:AbortSignal.timeout(3000)});
    if(r.ok){ mode='ryzen'; statusEl.innerHTML='<span class=online>ONLINE - Usando tu Ryzen qwen2.5:1.5b (potente)</span>'; log('Conectado a Ryzen '+ryzenIP,'online'); return true; }
  }catch(e){}
  mode='local'; statusEl.innerHTML='<span class=offline>OFFLINE - Sin datos, usando IA moderada local Qwen2-1.5B en iPhone</span>'; log('Sin Ryzen, iniciando IA local moderada...','offline'); await initLocal(); return false;
}

async function initLocal(){
  log('Descargando Qwen2-1.5B-Q4_1 (1.1GB primera vez, luego offline)...');
  engine = await CreateMLCEngine("Qwen2-1.5B-q4f16_1", {initProgressCallback: p=>{ statusEl.textContent=p.text; }});
  log('IA moderada local lista - 100% offline, sin internet','offline');
}

async function send(){
  const text=document.getElementById('msg').value; if(!text) return;
  log('Tu: '+text); document.getElementById('msg').value='';
  if(mode==='ryzen'){
    try{
      const r=await fetch('http://'+ryzenIP+':3100/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
      const d=await r.json(); log('Ryzen: '+(d.response||d.message||JSON.stringify(d)),'online');
      // guardar offline por si se cae
      localStorage.setItem('rf_queue', JSON.stringify([...JSON.parse(localStorage.getItem('rf_queue')||'[]'),{text,ts:Date.now()}]));
    }catch(e){ log('Ryzen caido, cambiando a local...'); await checkRyzen(); sendLocal(text); }
  }else{ await sendLocal(text); }
}

async function sendLocal(text){
  if(!engine) await initLocal();
  const chunks=await engine.chat.completions.create({messages:[{role:'user',content:text}],stream:true});
  let reply=''; for await(const c of chunks){ const t=c.choices[0]?.delta?.content||''; reply+=t; statusEl.textContent=reply.slice(-80); }
  log('Local Qwen2-1.5B: '+reply,'offline');
}
window.send=send;
checkRyzen();
setInterval(checkRyzen,15000);
</script>
</body></html>
