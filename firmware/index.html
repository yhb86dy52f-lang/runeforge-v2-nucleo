        :root {
          --bg: #0a0f0d; --surface: #131a17; --surface-light: #1c2621;
          --primary: #00d97a; --primary-glow: rgba(0,217,122,.3);
          --lmu-color: #00b3ff; --lmu-glow: rgba(0,179,255,.3);
          --apple-color: #af52de; --text: #eef5f0; --text-dim: #8fa396;
          --danger: #ff5c5c; --warning: #ffb84d; --radius: 16px;
          --shadow: 0 8px 24px rgba(0,0,0,.5); --transition: .2s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{background:var(--bg)}
        .app-root{min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;padding-top:max(16px, env(safe-area-inset-top));padding-bottom:96px;user-select:none}
        .app-container{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
        .header{background:var(--surface);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);border:1px solid rgba(0,217,122,.15);text-align:center;position:relative;overflow:hidden}
        .header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--lmu-color),var(--apple-color))}
        .logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:800;color:var(--primary)}
        .subtitle{font-size:12px;color:var(--text-dim);margin-top:4px;font-weight:500}
        .badge{display:inline-block;background:rgba(0,217,122,.12);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-top:8px;letter-spacing:.3px;border:1px solid rgba(0,217,122,.2)}
        .panel{background:var(--surface);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.06)}
        .panel-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
        .panel-title{font-size:13px;font-weight:700;color:var(--text);display:flex;gap:8px;align-items:center}
        .panel-toggle{font-size:12px;color:var(--text-dim);background:var(--surface-light);border:1px solid rgba(255,255,255,.08);padding:6px 10px;border-radius:20px}
        .config-grid{margin-top:12px;display:grid;gap:12px}
        .field{display:flex;flex-direction:column;gap:6px}
        .field label{font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
        .field input[type=text]{background:var(--surface-light);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:10px 12px;border-radius:10px;font-size:13px;outline:none}
        .field input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
        .range-row{display:flex;align-items:center;gap:10px}
        .range-row input[type=range]{flex:1;accent-color:var(--primary)}
        .range-val{font-size:12px;font-weight:800;color:var(--primary);min-width:48px;text-align:right}
        .switch-row{display:flex;align-items:center;justify-content:space-between}
        .switch{position:relative;width:44px;height:26px;background:#2a3a32;border-radius:20px;cursor:pointer;transition:all var(--transition)}
        .switch.active{background:var(--primary)}
        .switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:all var(--transition);display:block}
        .switch.active i{transform:translateX(18px)}
        .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;align-items:center}
        .filters::-webkit-scrollbar{display:none}
        @media (max-width:480px){
          .filters{flex-wrap:wrap;overflow-x:visible}
          .search{flex-basis:100%;min-width:100%}
        }
        .filter-btn{background:var(--surface);color:var(--text-dim);border:1px solid rgba(255,255,255,.1);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all var(--transition)}
        .filter-btn.active{background:var(--primary);color:#000;border-color:var(--primary)}
        .filter-btn.lmu.active{background:var(--lmu-color);border-color:var(--lmu-color);color:#000}
        .filter-btn.apple.active{background:var(--apple-color);border-color:var(--apple-color);color:#fff}
        .search{flex:1;min-width:120px;position:relative;max-width:100%}
        .search input{background:var(--surface-light);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:8px 12px 8px 32px;border-radius:20px;font-size:12px;width:100%;outline:none}
        .search span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
        .progress-section{background:var(--surface);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);border:1px solid rgba(0,217,122,.1)}
        .progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .progress-header .label{font-size:13px;color:var(--text-dim);font-weight:600}
        .progress-header .count{font-size:14px;font-weight:800;color:var(--primary)}
        .progress-bar{height:8px;background:var(--surface-light);border-radius:10px;overflow:hidden;margin-bottom:8px}
        .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--lmu-color));border-radius:10px;transition:width .5s cubic-bezier(.22,1,.36,1);box-shadow:0 0 12px var(--primary-glow)}
        .progress-stats{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);font-weight:500;flex-wrap:wrap;gap:6px}
        .stat-highlight{color:var(--primary);font-weight:700}
        .type-stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
        .type-chip{font-size:10px;padding:4px 8px;border-radius:10px;font-weight:700;border:1px solid rgba(255,255,255,.1)}
        .type-chip.kw{background:rgba(0,217,122,.12);color:var(--primary);border-color:rgba(0,217,122,.2)}
        .type-chip.lmu{background:rgba(0,179,255,.12);color:var(--lmu-color);border-color:rgba(0,179,255,.2)}
        .type-chip.apple{background:rgba(175,82,222,.12);color:var(--apple-color);border-color:rgba(175,82,222,.2)}
        .type-chip.other{background:rgba(255,255,255,.06);color:var(--text-dim)}
        .scan-button{background:linear-gradient(135deg,#00d97a,#00b36b);color:#000;font-weight:800;font-size:15px;letter-spacing:.5px;border:none;border-radius:var(--radius);padding:16px 24px;cursor:pointer;box-shadow:0 8px 20px rgba(0,217,122,.35);transition:all var(--transition);display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
        .scan-button:active{transform:scale(.98)}
        .scan-button:disabled{background:#2a3a32;color:#6b7f73;box-shadow:none}
        .scan-button .spinner{display:none;width:18px;height:18px;border:3px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .8s linear infinite}
        .scan-button.scanning .spinner{display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}
        .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .action-btn{background:var(--surface);color:var(--text);border:1px solid rgba(255,255,255,.1);padding:10px 12px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all var(--transition)}
        .action-btn:active{transform:scale(.97)}
        .action-btn.primary{background:var(--surface-light);border-color:rgba(0,217,122,.2);color:var(--primary)}
        .devices-grid{display:flex;flex-direction:column;gap:10px}
        .device-card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.05);animation:slideIn .3s ease-out;position:relative;overflow:hidden;gap:10px}
        .device-card.kw{border-left:4px solid var(--primary)}
        .device-card.lmu{border-left:4px solid var(--lmu-color)}
        .device-card.apple{border-left:4px solid var(--apple-color)}
        .device-card.other{border-left:4px solid var(--text-dim)}
        @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .device-info{flex:1;min-width:0}
        .device-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .device-name .tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:800;text-transform:uppercase;flex-shrink:0}
        .tag.kw{background:rgba(0,217,122,.15);color:var(--primary)}
        .tag.lmu{background:rgba(0,179,255,.15);color:var(--lmu-color)}
        .tag.apple{background:rgba(175,82,222,.15);color:var(--apple-color)}
        .tag.other{background:rgba(255,255,255,.08);color:var(--text-dim)}
        .device-meta{font-size:11px;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
        .device-meta .id-box{font-family:monospace;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px;font-size:10px}
        .device-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
        .mini-btn{font-size:10px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:var(--surface-light);color:var(--text-dim);cursor:pointer}
        .mini-btn.connect{color:var(--primary);border-color:rgba(0,217,122,.2)}
        .mini-btn.danger{color:var(--danger)}
        .rssi-section{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:72px;flex-shrink:0}
        .rssi-value{font-size:11px;font-weight:800;color:var(--text-dim)}
        .rssi-bat{font-size:10px;color:var(--primary);font-weight:700}
        .rssi-label{font-size:8px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
        .pending-list{background:var(--surface);border-radius:var(--radius);padding:12px 16px;border:1px dashed rgba(255,92,92,.35);box-shadow:var(--shadow)}
        .pending-list.done{border-color:rgba(0,217,122,.3);border-style:solid}
        .pending-list .title{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
        .pending-tags{display:flex;flex-wrap:wrap;gap:6px}
        .pending-tag{background:rgba(255,92,92,.1);color:#ff9e9e;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid rgba(255,92,92,.18);cursor:pointer}
        .pending-tag.done{background:rgba(0,217,122,.12);color:var(--primary);border-color:rgba(0,217,122,.2);text-decoration:line-through;opacity:.7}
        .empty-state{text-align:center;padding:24px 20px;color:var(--text-dim);font-size:12px;font-weight:500;border:2px dashed var(--surface-light);border-radius:var(--radius)}
        .error-log{background:#1a0f0f;border-radius:var(--radius);padding:10px 14px;border:1px solid rgba(255,92,92,.25);font-family:monospace;font-size:10px;color:#ff9e9e;max-height:160px;overflow-y:auto}
        .error-log .title{color:var(--danger);font-weight:700;margin-bottom:6px;font-size:11px;display:flex;justify-content:space-between;align-items:center}
        .error-line{padding:2px 0;border-bottom:1px solid rgba(255,92,92,.08);word-break:break-all}
        .toast-wrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:460px;display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none}
        .toast{background:var(--surface);color:var(--text);padding:12px 14px;border-radius:12px;font-size:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px;animation:slideUp .25s ease;pointer-events:auto}
        .toast.ok{border-color:rgba(0,217,122,.25)}
        .toast.warn{border-color:rgba(255,184,77,.25)}
        .toast.err{border-color:rgba(255,92,92,.3)}
