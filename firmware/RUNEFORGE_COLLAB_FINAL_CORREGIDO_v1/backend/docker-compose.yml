services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: runeforge-mqtt
    ports:
      - "1883:1883"   # TCP  → Scanner
      - "9001:9001"   # WS   → Dashboards browser
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: runeforge-nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    environment:
      - TZ=America/Monterrey
    depends_on:
      - mqtt
    restart: unless-stopped

volumes:
  mqtt_data:
  nodered_data: