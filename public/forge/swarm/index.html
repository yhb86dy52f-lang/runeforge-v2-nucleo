<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Runeforge — Enjambre Multi-Agente</title>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #00ff66; 
            font-family: monospace; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 950px; 
            margin: auto; 
            background: #121824; 
            border: 1px solid #1f293d; 
            padding: 30px; 
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.1);
        }
        .nav-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #1f293d; 
            padding-bottom: 15px; 
        }
        .btn-regresar { 
            background: transparent; 
            color: #00ff66; 
            border: 1px solid #00ff66; 
            padding: 8px 15px; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 4px; 
            transition: all 0.3s;
        }
        .btn-regresar:hover { 
            background: #00ff66; 
            color: #000; 
        }
        textarea { 
            width: 100%; 
            height: 120px; 
            background: #0b0f19; 
            color: #00ff66; 
            border: 1px solid #00ff66; 
            padding: 12px; 
            font-family: monospace; 
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
        }
        button.action-btn { 
            background: #00ff66; 
            color: #000; 
            border: none; 
            padding: 12px 25px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            margin-top: 15px; 
            font-size: 1em;
            transition: background 0.3s;
        }
        button.action-btn:hover { 
            background: #00cc52; 
        }
        .output-box { 
            background: #0b0f19; 
            border: 1px solid #1f293d; 
            padding: 20px; 
            margin-top: 25px; 
            border-radius: 4px;
            display: none; 
        }
        .trace-content { 
            color: #888; 
            font-size: 0.9em; 
            margin-bottom: 15px; 
            border-left: 2px solid #00ff66; 
            padding-left: 12px; 
            white-space: pre-wrap; 
        }
        .code-content { 
            white-space: pre-wrap; 
            color: #00ff66; 
        }
        #swarm-loading { 
            display: none; 
            margin-top: 15px; 
            color: #ffcc00; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <h2>🐝 RUNEFORGE SWARM (Qwen + DeepSeek)</h2>
            <a href="/forge" class="btn-regresar">← Volver al Panel Principal</a>
        </div>
        
        <p>Orquestación Multi-Agente local conectada soberanamente al puerto 3105.</p>
        
        <label for="swarm-task"><strong>Describe tu tarea técnica o de código:</strong></label><br><br>
        <textarea id="swarm-task" placeholder="Ej. Escribe un script en PowerShell para listar servicios caídos..."></textarea><br>
        
        <button class="action-btn" onclick="ejecutarEnjambreNativo()">⚡ Desplegar Enjambre</button>

        <div id="swarm-loading">⚡ El enjambre está procesando y rotando modelos en VRAM...</div>

        <div class="output-box" id="swarm-result-container">
            <h3>🧠 Trazas del Supervisor (Qwen):</h3>
            <div class="trace-content" id="swarm-trace-output"></div>
            <h3>💻 Solución / Código Final (DeepSeek):</h3>
            <div class="code-content" id="swarm-code-output"></div>
        </div>
    </div>

    <script>
        async function ejecutarEnjambreNativo() {
            const task = document.getElementById('swarm-task').value;
            if (!task) return alert('Por favor escribe una tarea.');

            document.getElementById('swarm-loading').style.display = 'block';
            document.getElementById('swarm-result-container').style.display = 'none';

            try {
                const res = await fetch('http://127.0.0.1:3105/api/swarm/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                const data = await res.json();

                document.getElementById('swarm-loading').style.display = 'none';
                if (data.ok) {
                    document.getElementById('swarm-result-container').style.display = 'block';
                    document.getElementById('swarm-trace-output').innerText = data.trace ? data.trace.join('\n') : 'Sin trazas';
                    document.getElementById('swarm-code-output').innerText = data.result;
                } else {
                    alert('Error en el enjambre: ' + (data.error || 'Desconocido'));
                }
            } catch (err) {
                document.getElementById('swarm-loading').style.display = 'none';
                alert('No se pudo conectar con el microservicio en el puerto 3105. Verifica que PM2 mantenga el servicio activo.');
            }
        }
    </script>
</body>
</html>
