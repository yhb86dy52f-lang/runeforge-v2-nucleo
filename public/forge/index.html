<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Runeforge — Núcleo Global Unificado</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #121824;
            --border-color: #1f293d;
            --accent: #00ff66;
            --accent-hover: #00cc52;
            --text-main: #00ff66;
            --text-muted: #888888;
            --warning: #ffcc00;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Barra superior unificada */
        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo-area {
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-tabs {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .nav-tab {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .nav-tab:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .nav-tab.active {
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }
        /* Contenedor de vistas */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .view-section {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        .view-section.active {
            display: block;
        }
        /* Estilos específicos para la vista principal de Enjambre (Swarm) */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        textarea {
            width: 100%;
            height: 120px;
            background: var(--bg-color);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px;
            font-family: inherit;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            margin-top: 10px;
        }
        .btn-action {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.95rem;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background: var(--accent-hover);
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media(max-width: 900px) {
            .results-grid { grid-template-columns: 1fr; }
        }
        .result-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            font-size: 0.95rem;
        }
        .trace-content {
            color: var(--text-muted);
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .code-content {
            color: var(--accent);
            font-size: 0.9rem;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        #loading-swarm {
            display: none;
            color: var(--warning);
            margin-top: 15px;
            font-weight: bold;
        }
        iframe.embedded-panel {
            width: 100%;
            height: 75vh;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--panel-bg);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <span>⚡ RUNEFORGE V2.0</span>
        </div>
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchView('swarm', this)">🐝 Enjambre Swarm</button>
            <button class="nav-tab" onclick="switchView('bitacora', this)">Bitácora PRO</button>
            <button class="nav-tab" onclick="switchView('mission', this)">Mission Control</button>
            <button class="nav-tab" onclick="switchView('control', this)">Control IA</button>
            <button class="nav-tab" onclick="switchView('pwa', this)">PWA Offline</button>
            <button class="nav-tab" onclick="switchView('iphone', this)">Acceso iPhone</button>
            <button class="nav-tab" onclick="switchView('deepseek', this)">DeepSeek</button>
            <button class="nav-tab" onclick="switchView('infograma', this)">Infografía</button>
            <button class="nav-tab" onclick="switchView('roadmap', this)">Roadmap</button>
            <button class="nav-tab" onclick="switchView('chat', this)">Chat Simple</button>
        </div>
    </header>

    <main>
        <!-- VISTA 1: ENJAMBRE SWARM (OBJETIVO PRINCIPAL) -->
        <section id="view-swarm" class="view-section active">
            <div class="card">
                <h2>🐝 RUNEFORGE SWARM (Qwen + DeepSeek)</h2>
                <p>Orquestación Multi-Agente local conectada soberanamente al puerto 3105.</p>
                <label for="swarm-task"><strong>Describe tu tarea técnica, script o arquitectura:</strong></label>
                <textarea id="swarm-task" placeholder="Ej. Escribe un script en PowerShell para verificar servicios caídos..."></textarea>
                <button class="btn-action" onclick="ejecutarEnjambre()">⚡ Desplegar Enjambre</button>
                <div id="loading-swarm">⚡ El supervisor (Qwen) y el ejecutor (DeepSeek) están procesando en VRAM local...</div>
            </div>

            <div class="results-grid">
                <div class="result-box" id="box-trace">
                    <h3>🧠 Trazas del Supervisor (Qwen)</h3>
                    <div class="trace-content" id="trace-output"></div>
                </div>
                <div class="result-box" id="box-code">
                    <h3>💻 Código / Solución Final (DeepSeek)</h3>
                    <div class="code-content" id="code-output"></div>
                </div>
            </div>
        </section>

        <!-- VISTAS HISTÓRICAS INTEGRADAS MEDIANTE IFRAMES LOCALES -->
        <section id="view-bitacora" class="view-section">
            <iframe src="/pages/bit_cora_pro_web_app.html" class="embedded-panel"></iframe>
        </section>
        <section id="view-mission" class="view-section">
            <iframe src="/pages/mission.html" class="embedded-panel"></iframe>
        </section>
        <section id="view-control" class="view-section">
            <iframe src="/pages/control.html" class="embedded-panel"></iframe>
        </section>
        <section id="view-pwa" class="view-section">
            <iframe src="/pages/pwa.html" class="embedded-panel"></iframe>
        </section>
        <section id="view-iphone" class="view-section">
            <iframe src="/pages/acceso.html" class="embedded-panel"></iframe>
        </section>
        <section id="view-deepseek" class="view-section">
            <iframe src="/pages/deepseek.html" class="embedded-panel"></iframe>
        </section>
        <section id="view-infograma" class="view-section">
            <iframe src="/pages/infograma.html" class="embedded-panel"></iframe>
        </section>
        <section id="view-roadmap" class="view-section">
            <iframe src="/pages/roadmap.html" class="embedded-panel"></iframe>
        </section>
        <section id="view-chat" class="view-section">
            <iframe src="/pages/chat.html" class="embedded-panel"></iframe>
        </section>
    </main>

    <script>
        function switchView(viewName, btnElement) {
            // Ocultar todas las secciones
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            // Remover clase active de los botones
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            
            // Activar la vista y botón seleccionados
            document.getElementById('view-' + viewName).classList.add('active');
            btnElement.classList.add('active');
        }

        async function ejecutarEnjambre() {
            const task = document.getElementById('swarm-task').value.trim();
            if (!task) return alert('Por favor ingresa una tarea.');

            const loading = document.getElementById('loading-swarm');
            const boxTrace = document.getElementById('box-trace');
            const boxCode = document.getElementById('box-code');

            loading.style.display = 'block';
            boxTrace.style.display = 'none';
            boxCode.style.display = 'none';

            try {
                const res = await fetch('http://127.0.0.1:3105/api/swarm/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                const data = await res.json();

                loading.style.display = 'none';
                if (data.ok) {
                    boxTrace.style.display = 'block';
                    boxCode.style.display = 'block';
                    document.getElementById('trace-output').innerText = data.trace ? data.trace.join('\n') : 'Sin trazas registradas.';
                    document.getElementById('code-output').innerText = data.result || 'Sin resultado generado.';
                } else {
                    alert('Error en el motor del enjambre: ' + (data.error || 'Desconocido'));
                }
            } catch (err) {
                loading.style.display = 'none';
                alert('No se pudo establecer comunicación con el microservicio en el puerto 3105. Verifica que PM2 lo mantenga activo.');
            }
        }
    </script>
</body>
</html>
