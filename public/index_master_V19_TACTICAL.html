<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEPCOLGPS NEXUS - TACTICAL COMMAND CENTER V19</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&display=swap');
  :root { --bg-base: #030508; --neon-green: #3dd598; --neon-red: #ff4757; --neon-blue: #2d6cdf; --panel-bg: rgba(10, 16, 30, 0.75); }
  body { margin: 0; background-color: var(--bg-base); background-image: radial-gradient(circle at 10% 20%, rgba(45, 108, 223, 0.15), transparent 30%), radial-gradient(circle at 90% 80%, rgba(61, 213, 152, 0.1), transparent 30%); color: #e2e8f0; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
  .glass { background: var(--panel-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); border-radius: 24px; }
  .glow-text { text-shadow: 0 0 15px currentColor; }
  .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.6) 51%); background-size: 100% 4px; z-index: 10; pointer-events: none; opacity: 0.2; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const decodeCT = (hex) => {
  let clean = hex.toUpperCase().replace(/[^0-9A-F]/g, '');
  if (clean.length % 2 === 1) clean = '0' + clean;
  if (clean.length < 20) return null;
  const bytes = [];
  for (let i = 0; i < clean.length; i += 2) bytes.push(parseInt(clean.substr(i, 2), 16));
  const u16 = [];
  for (let i = 0; i < bytes.length - 1; i += 2) u16.push((bytes[i] << 8) | bytes[i + 1]);
  const c3E70 = u16.filter(v => v === 0x3E70).length;
  const cFFFF = u16.filter(v => v === 0xFFFF).length;
  const voltU = u16.filter(v => v >= 10000 && v <= 16000).pop() || null;
  const voltG = u16.filter(v => v >= 3500 && v <= 5000).pop() || null;
  let estado, badge, rec, s1Color, s2Color;
  if (c3E70 >= 2) { estado = "FALLA DOBLE TERMO"; badge = "bg-red-500/20 text-red-400 border-red-500/30"; rec = "Ambas sondas en 15984. Revisar cableado 1-Wire."; s1Color = s2Color = "#ff4757"; }
  else if (c3E70 === 1) { estado = "FALLA SIMPLE"; badge = "bg-yellow-500/20 text-yellow-400 border-yellow-500/30"; rec = "1 sonda OK, 1 en 15984."; s1Color = "#3dd598"; s2Color = "#ff4757"; }
  else if (cFFFF >= 2) { estado = "OK DESHABILITADO"; badge = "bg-blue-500/20 text-blue-400 border-blue-500/30"; rec = "Acumuladores en FFFF."; s1Color = s2Color = "#475569"; }
  else { estado = "BUENO PERFECTO"; badge = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30"; rec = "Sensores operando correctamente."; s1Color = s2Color = "#3dd598"; }
  return { type:'CT', voltU, voltG, c3E70, cFFFF, estado, badge, rec, s1Color, s2Color, raw: hex };
};

const decodeKW = (text) => {
  const accum = {}, esc = {};
  let rssi = null, hdop = null, m;
  if ((m = text.match(/rssi\s*=\s*(-?\d+)/i))) rssi = parseInt(m[1]);
  if ((m = text.match(/hdop\s*=\s*([0-9.]+)/i))) hdop = parseFloat(m[1]);
  const rAccum = /accum_(\d+)\s*=\s*(-?\d+)/gi;
  while ((m = rAccum.exec(text)) !== null) accum['accum_'+m[1]] = parseInt(m[2]);
  const rEsc = /esc_(temp|lev)_(\d+)\s*=\s*(-?\d+)/gi;
  while ((m = rEsc.exec(text)) !== null) esc['esc_'+m[1]+'_'+m[2]] = parseInt(m[3]);
  const lev1 = esc.esc_lev_0 || 0, lev2 = esc.esc_lev_1 || 0;
  const pct1 = Math.min(100, Math.max(0, lev1/4095*100));
  const pct2 = Math.min(100, Math.max(0, lev2/4095*100));
  let odo = (accum.accum_5 && accum.accum_5 >= 29000000 && accum.accum_5 <= 29200000) ? accum.accum_5 : null;
  let estado = "COMBUSTIBLE OK", badge = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
  if (rssi < -85) { estado = "SEÑAL MALA"; badge = "bg-yellow-500/20 text-yellow-400 border-yellow-500/30"; }
  return { type:'KW', rssi, hdop, lev1, lev2, pct1, pct2, odo, estado, badge, raw: text };
};

const decodeR0 = (text) => {
  let app = null, apn = null, mid = null, inp = null, m;
  if ((m = text.match(/APP:(\d+)\s+([^\s]+)/i))) app = m[1] + ' ' + m[2];
  if ((m = text.match(/DA\.\s*([^\s]+)/i))) apn = m[1];
  if ((m = text.match(/MID:(\d+)/i))) mid = m[1];
  if ((m = text.match(/INP:([01]+)/i))) inp = m[1];
  return { type:'R0', app, apn, mid, inp, estado: "STATUS OK", badge: "bg-cyan-500/20 text-cyan-400 border-cyan-500/30", raw: text };
};

const RadarCanvas = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current, ctx = canvas.getContext('2d');
    let animationFrameId, angle = 0;
    const draw = () => {
      const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 10;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(61, 213, 152, 0.2)'; ctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) { ctx.beginPath(); ctx.arc(cx, cy, (r/4)*i, 0, Math.PI*2); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(cx, cy-r); ctx.lineTo(cx, cy+r); ctx.moveTo(cx-r, cy); ctx.lineTo(cx+r, cy); ctx.stroke();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
      const grad = ctx.createLinearGradient(0, 0, r, 0);
      grad.addColorStop(0, 'rgba(61, 213, 152, 0.8)'); grad.addColorStop(1, 'rgba(61, 213, 152, 0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,0,Math.PI/4); ctx.lineTo(0,0); ctx.fill();
      ctx.restore(); angle += 0.05; animationFrameId = requestAnimationFrame(draw);
    };
    draw(); return () => cancelAnimationFrame(animationFrameId);
  }, []);
  return <canvas ref={canvasRef} width={300} height={300} className="w-full max-w-[280px] h-auto mx-auto opacity-80 mix-blend-screen" />;
};

const Gauge = ({ value, max, label, unit, color }) => {
  const pct = value ? Math.min(100, Math.max(0, (value/max)*100)) : 0;
  const activeColor = value ? color : '#334155';
  return (
    <div className="flex flex-col items-center justify-center p-3 glass rounded-2xl relative overflow-hidden">
      <div className="relative w-24 h-24">
        <svg width="100" height="100" viewBox="0 0 100 100" className="rotate-[-90deg]">
          <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="8"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke={activeColor} strokeWidth="8" strokeLinecap="round" strokeDasharray={`${pct/100*251} 251`} style={{transition:'stroke-dasharray 0.8s ease', filter:`drop-shadow(0 0 6px ${activeColor})`}}/>
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <span className="text-xl font-bold font-mono" style={{color: activeColor}}>{value !== null ? value.toFixed(2) : "--"}</span>
          <span className="text-[9px] text-gray-400 font-bold uppercase">{unit}</span>
        </div>
      </div>
      <div className="mt-2 text-[10px] text-gray-300 font-bold tracking-widest uppercase">{label}</div>
    </div>
  );
};

const App = () => {
  const [input, setInput] = useState("E4672144079FFFFFF0100006AD7AD6F6AD7AD6F0F39DD9EC24A588B00000002005C11000014FFAB8F070700FFFF0400002C0E00000FE400003E7000003E70");
  const [data, setData] = useState(null);
  const [history, setHistory] = useState(() => { try { return JSON.parse(localStorage.getItem('rf_history_v19') || '[]'); } catch { return []; } });
  const [activeTab, setActiveTab] = useState('diag');

  useEffect(() => {
    let d = null;
    if (input.includes('accum_') || input.includes('esc_')) d = decodeKW(input);
    else if (input.includes('APP:') || input.includes('MID:')) d = decodeR0(input);
    else d = decodeCT(input);
    setData(d);
    if (d) {
      const newEntry = { time: new Date().toLocaleTimeString(), type: d.type, status: d.estado, raw: input.slice(0, 50) + (input.length > 50 ? '...' : '') };
      setHistory(prev => { const u = [newEntry, ...prev].slice(0, 10); localStorage.setItem('rf_history_v19', JSON.stringify(u)); return u; });
    }
  }, [input]);

  const copyToClipboard = (t) => navigator.clipboard.writeText(t);
  const downloadJSON = () => { if(!data) return; const b = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `runeforge_v19_${data.type}.json`; a.click(); };

  return (
    <div className="min-h-screen p-4 flex justify-center relative">
      <div className="scanline"></div>
      <div className="w-full max-w-[480px] flex flex-col gap-4 relative z-20">
        <div className="glass p-5 text-center relative overflow-hidden">
          <h1 className="text-2xl font-black tracking-widest text-white glow-text">NEXUS <span className="text-[#3dd598]">TACTICAL</span></h1>
          <p className="text-[10px] text-gray-400 tracking-[0.3em] mt-1">MULTI-PROTOCOL V19</p>
        </div>
        <div className="flex gap-2 p-1 glass rounded-xl">
          {['diag', 'history', 'sms'].map(t => (
            <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-2 rounded-lg text-[11px] font-black tracking-widest uppercase transition-all ${activeTab === t ? 'bg-[#3dd598] text-black' : 'text-gray-400'}`}>{t === 'diag' ? '🔋 DIAG' : t === 'history' ? '📜 HIST' : '📡 SMS'}</button>
          ))}
        </div>
        {activeTab === 'diag' && (
          <div className="flex flex-col gap-4">
            <div className="glass p-4 flex flex-col gap-3">
              <div className="flex justify-between"><span className="text-[10px] text-gray-400">INPUT STREAM</span>{data && <span className={`px-3 py-1 rounded-full text-[10px] font-black border ${data.badge}`}>{data.type}</span>}</div>
              <textarea value={input} onChange={(e) => setInput(e.target.value)} className="w-full h-28 bg-black/50 border border-white/10 rounded-xl p-3 text-[11px] text-[#3dd598] font-mono focus:outline-none" />
              <div className="flex gap-2">
                <button onClick={() => copyToClipboard(input)} className="flex-1 py-2 bg-white/10 rounded-lg text-[10px] text-white">COPIAR</button>
                <button onClick={downloadJSON} className="flex-1 py-2 bg-[#3dd598] rounded-lg text-[10px] text-black font-bold">JSON</button>
              </div>
            </div>
            <div className="glass p-2 flex flex-col items-center col-span-2 relative"><RadarCanvas /></div>
            {data && data.type === 'CT' && (
              <div className="grid grid-cols-2 gap-3">
                <Gauge value={data.voltU ? data.voltU/1000 : null} max={15} label="VOLT UNIDAD" unit="V" color="#3dd598" />
                <Gauge value={data.voltG ? data.voltG/1000 : null} max={5} label="VOLT GPS" unit="V" color="#2d6cdf" />
              </div>
            )}
            {data && (
              <div className="glass p-5 flex flex-col gap-4 text-center">
                <div className={`text-xl font-black ${data.badge.split(' ')[1]}`}>{data.estado}</div>
                {data.rec && <div className="text-[11px] text-gray-400">{data.rec}</div>}
                {data.type === 'CT' && (
                  <svg viewBox="0 0 340 140" className="w-full">
                    <rect x="10" y="20" width="200" height="90" rx="8" fill="rgba(15,23,42,0.8)" stroke="#2d6cdf" strokeWidth="2"/>
                    <circle cx="60" cy="75" r="18" fill={data.s1Color} stroke="#0f172a" strokeWidth="3"/>
                    <text x="60" y="79" textAnchor="middle" fill="#0f172a" fontSize="11" fontWeight="900">S1</text>
                    <circle cx="160" cy="75" r="18" fill={data.s2Color} stroke="#0f172a" strokeWidth="3"/>
                    <text x="160" y="79" textAnchor="middle" fill="#0f172a" fontSize="11" fontWeight="900">S2</text>
                  </svg>
                )}
              </div>
            )}
          </div>
        )}
        {activeTab === 'history' && (
          <div className="glass p-5 flex flex-col gap-3">
            {history.length === 0 ? <div className="text-gray-500 text-center py-4">Sin registros</div> : history.map((h,i) => (
              <div key={i} className="bg-black/30 p-3 rounded-lg border border-white/5">
                <div className="flex justify-between text-[10px] text-gray-400"><span>[{h.time}]</span><span className="text-[#3dd598]">{h.type}</span></div>
                <div className="text-[11px] text-gray-300">{h.status}</div>
              </div>
            ))}
          </div>
        )}
        {activeTab === 'sms' && (
          <div className="glass p-5 flex flex-col gap-4">
            {['!r4','!r0','!rg','!ra'].map(c => (
              <div key={c} className="flex justify-between items-center bg-black/30 p-3 rounded-lg">
                <div className="text-[12px] font-black text-[#3dd598]">{c}</div>
                <button onClick={() => { copyToClipboard(c); alert(`${c} copiado`); }} className="px-4 py-2 bg-white text-black text-[10px] font-bold rounded-lg">COPIAR</button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
