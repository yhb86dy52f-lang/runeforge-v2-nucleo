<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SEPCOLGPS NEXUS - V25 FINAL COMMAND CENTER</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-base: #030508;
      --neon-green: #3dd598;
      --neon-red: #ff4757;
      --neon-blue: #2d6cdf;
      --neon-cyan: #5eead4;
      --text-main: #e2e8f0;
      --text-muted: #7a869e;
      --panel-bg: rgba(10, 16, 30, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      background-image: radial-gradient(circle at 10% 20%, rgba(45, 108, 223, 0.15), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(61, 213, 152, 0.1), transparent 30%);
      color: var(--text-main);
      font-family: ui-monospace, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .glass {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 15px var(--neon-green);
    }

    .header p {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1 1 30%;
      padding: 8px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 10px;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
    }

    .tab-btn.active {
      background: var(--neon-green);
      color: black;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 11px;
      outline: none;
      resize: none;
    }

    .btn {
      padding: 10px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--neon-green);
      color: black;
    }

    .btn-danger {
      background: var(--neon-red);
      color: white;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .history-item {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-CT {
      background: rgba(61, 213, 152, 0.15);
      color: var(--neon-green);
    }

    .badge-KW {
      background: rgba(45, 108, 223, 0.15);
      color: var(--neon-blue);
    }

    .badge-R0 {
      background: rgba(94, 234, 212, 0.15);
      color: var(--neon-cyan);
    }

    .chart-wrapper {
      width: 100%;
      height: 220px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 300px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1;
    }

    .leaflet-layer,
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out,
    .leaflet-control-attribution {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="glass header">
      <h1>NEXUS TACTICAL V25</h1>
      <p>FINAL COMMAND CENTER</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('live', this)">🔴 LIVE</button>
      <button class="tab-btn" onclick="switchTab('map', this)">🗺️ MAPA</button>
      <button class="tab-btn" onclick="switchTab('charts', this)">📊 GRÁFICA</button>
      <button class="tab-btn" onclick="switchTab('db', this)">🗄️ DB</button>
    </div>

    <div id="tab-live" class="glass" style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:10px; color:var(--text-muted);">SIMULADOR DE FLOTA</span>
        <span id="wsStatus" class="badge"
          style="padding:2px 8px; border-radius:99px; font-size:10px; font-weight:700;">DETENIDO</span>
      </div>
      <button id="btnStart" class="btn btn-primary" onclick="toggleSimulator()">INICIAR SIMULADOR</button>
      <div
        style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; font-size: 10px; color: var(--text-muted); word-break: break-all;">
        <div style="font-weight: 700; margin-bottom: 4px;">ÚLTIMA TRAMA RECIBIDA:</div>
        <div id="liveData">Esperando datos...</div>
      </div>
    </div>

    <div id="tab-map" class="glass hidden" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:10px; color:var(--text-muted);">POSICIÓN GPS (LIVE)</span>
        <span id="gpsStatus" class="badge badge-CT">ACTIVO</span>
      </div>
      <div id="map"></div>
      <div style="font-size: 10px; color: var(--text-muted); text-align: center;">
        Lat: <span id="coordLat" style="color: white;">20.5888</span> |
        Lng: <span id="coordLng" style="color: white;">-100.3898</span>
      </div>
    </div>

    <div id="tab-charts" class="glass hidden" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:10px; color:var(--text-muted);">EVOLUCIÓN HISTÓRICA</span>
        <select id="chartMetric" onchange="drawChart()"
          style="background:rgba(0,0,0,0.4); color:white; border:1px solid rgba(255,255,255,0.1); padding:4px; border-radius:8px; font-size:11px;">
          <option value="volt">Voltaje Unidad (CT)</option>
          <option value="fuel">Nivel Combustible (KW)</option>
        </select>
      </div>
      <div class="chart-wrapper">
        <canvas id="chartCanvas" width="400" height="220"></canvas>
      </div>
    </div>

    <div id="tab-db" class="glass hidden" style="padding: 16px;">
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="dbSearch" placeholder="Buscar..." oninput="renderDB()"
          style="flex:1; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.3); color:white;">
        <button class="btn btn-secondary" onclick="exportToCSV()">CSV</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script>
    let db;
    const DB_NAME = 'RuneforgeTelemetryDB';
    const STORE_NAME = 'tramas';
    // === CONEXIÓN A LA API DE PYTHON ===
    async function cargarDatosRealesAPI() {
      try {
        console.log("Conectando a la base de datos real...");

        // Pedimos los últimos 50 datos a tu servidor de Python
        const response = await fetch('http://127.0.0.1:8000/api/telemetry?limit=50');

        if (!response.ok) throw new Error('API no responde');
        const datos = await response.json();

        console.log(`¡Conectado! Se recibieron ${datos.length} registros reales.`);

        // 1. Actualizar el panel de LIVE
        const liveData = document.getElementById('liveData');
        if (liveData && datos.length > 0) {
          const ultimo = datos[0];
          liveData.textContent = `Último dato (${ultimo.type}): Voltaje ${ultimo.voltage || '--'}V | Temp ${ultimo.temperature || '--'}°C | Origen: ${ultimo.source_file}`;
        }

        // 2. Llenar la lista de la pestaña DB (Historial)
        const historyList = document.getElementById('historyList');
        if (historyList) {
          historyList.innerHTML = datos.map(item => {
            // Formateamos la fecha
            const fecha = item.fecha_registro ? new Date(item.fecha_registro).toLocaleString() : 'S/F';

            return `
            <div class="history-item">
              <div style="display:flex; justify-content:space-between;">
                <span style="color:var(--text-muted); font-size:9px;">${fecha}</span>
                <span class="badge badge-${item.type === 'KW' ? 'KW' : 'CT'}">${item.type}</span>
              </div>
              <div style="color:white; margin-top:4px; font-weight:700;">
                Voltaje: <span style="color:var(--neon-green)">${item.voltage ? item.voltage.toFixed(2) + ' V' : '--'}</span> 
                | Temp: <span style="color:var(--neon-blue)">${item.temperature ? item.temperature.toFixed(1) + ' °C' : '--'}</span>
              </div>
              <div style="font-size:9px; color:gray; margin-top: 2px;">Archivo: ${item.source_file}</div>
            </div>
          `;
          }).join('');
        }

      } catch (error) {
        console.error("Error al conectar con la API:", error);
        alert("No se pudo conectar con el backend. ¿El servidor de Python sigue encendido?");
      }
    }

    // Llamamos a la función cuando la página cargue
    cargarDatosRealesAPI();

    // (Opcional) Actualizar automáticamente cada 30 segundos
    setInterval(cargarDatosRealesAPI, 30000);

    // initDB(); <-- Puedes dejar esto o comentarlo si ya no usas el simulador

    function initDB() {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = function (e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        }
      };
      request.onsuccess = function (e) {
        db = e.target.result;
        renderDB();
      };
    }

    function saveRecordToDB(decoded) {
      if (!db) return;
      const transaction = db.transaction([STORE_NAME], 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const record = {
        type: decoded.type,
        status: decoded.status,
        raw: decoded.raw,
        valToGraph: decoded.valToGraph,
        timestamp: new Date().toISOString()
      };
      store.add(record).onsuccess = () => {
        renderDB();
        if (!document.getElementById('tab-charts').classList.contains('hidden')) drawChart();
      };
    }

    function renderDB() {
      if (!db) return;
      const list = document.getElementById('historyList');
      const transaction = db.transaction([STORE_NAME], 'readonly');
      const store = transaction.objectStore(STORE_NAME);
      const filter = document.getElementById('dbSearch').value.toLowerCase();

      store.getAll().onsuccess = (e) => {
        let data = e.target.result || [];
        data.sort((a, b) => b.id - a.id);
        if (filter) {
          data = data.filter(item => item.type.toLowerCase().includes(filter) || item.raw.toLowerCase().includes(filter));
        }
        if (data.length === 0) {
          list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted)">No hay datos</div>';
          return;
        }
        list.innerHTML = data.slice(0, 50).map(item => `
        <div class="history-item">
          <div style="display:flex; justify-content:space-between;">
            <span style="color:var(--text-muted); font-size:9px;">${new Date(item.timestamp).toLocaleTimeString()}</span>
            <span class="badge badge-${item.type}">${item.type}</span>
          </div>
          <div style="color:white; margin-top:4px; font-weight:700;">${item.status} (${item.valToGraph.toFixed(2)})</div>
        </div>
      `).join('');
      };
    }

    function exportToCSV() {
      if (!db) return;
      const transaction = db.transaction([STORE_NAME], 'readonly');
      const store = transaction.objectStore(STORE_NAME);
      store.getAll().onsuccess = (e) => {
        let data = e.target.result || [];
        if (!data.length) return alert('DB vacía');
        let csv = "ID,Fecha,Tipo,Estado,Valor,Raw\n";
        data.forEach(i => {
          csv += `${i.id},"${i.timestamp}","${i.type}","${i.status}",${i.valToGraph},"${i.raw}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `telemetry_${Date.now()}.csv`;
        a.click();
      };
    }

    function generateSimulatedData() {
      const isCT = Math.random() > 0.5;
      let raw, decoded;
      if (isCT) {
        const volt = Math.floor((Math.random() * 3500) + 11000);
        const hexVolt = volt.toString(16).padStart(4, '0').toUpperCase();
        raw = `E4672144079FFFFFF0100006AD7AD6F${hexVolt}000003E7000003E70`;
        decoded = { type: 'CT', status: 'Trama CT', raw: raw, valToGraph: volt / 1000 };
      } else {
        const level = Math.floor((Math.random() * 3686) + 409);
        raw = `rssi=-70, hdop=0.8, accum_0=12585, esc_lev_0=${level}`;
        decoded = { type: 'KW', status: 'Trama KW', raw: raw, valToGraph: (level / 4095) * 100 };
      }
      return decoded;
    }

    function drawChart() {
      if (!db) return;
      const canvas = document.getElementById('chartCanvas');
      const ctx = canvas.getContext('2d');
      const metric = document.getElementById('chartMetric').value;
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      db.transaction([STORE_NAME], 'readonly').objectStore(STORE_NAME).getAll().onsuccess = (e) => {
        let allData = e.target.result || [];
        let data = allData.filter(d => metric === 'volt' ? d.type === 'CT' : d.type === 'KW');
        if (data.length < 2) {
          ctx.fillStyle = '#7a869e'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
          ctx.fillText('Se necesitan al menos 2 datos', w / 2, h / 2);
          return;
        }
        data.sort((a, b) => a.id - b.id);
        let maxVal = Math.max(...data.map(d => d.valToGraph)) * 1.1;
        let minVal = Math.min(...data.map(d => d.valToGraph)) * 0.9;
        if (maxVal === minVal) maxVal = minVal + 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          let y = h - (i / 4) * h;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
        ctx.strokeStyle = metric === 'volt' ? '#3dd598' : '#2d6cdf'; ctx.lineWidth = 2;
        ctx.beginPath();
        let stepX = w / (data.length - 1);
        data.forEach((d, i) => {
          let x = i * stepX;
          let y = h - (((d.valToGraph - minVal) / (maxVal - minVal)) * h);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      };
    }

    const map = L.map('map', { zoomControl: false }).setView([20.5888, -100.3898], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    const tacticalIcon = L.divIcon({
      className: 'custom-icon',
      html: '<div style="background:#3dd598; width:12px; height:12px; border-radius:50%; box-shadow:0 0 10px #3dd598; border: 2px solid white;"></div>',
      iconSize: [12, 12], iconAnchor: [6, 6]
    });

    let marker = L.marker([20.5888, -100.3898], { icon: tacticalIcon }).addTo(map);
    let latlngs = [[20.5888, -100.3898]];
    let path = L.polyline(latlngs, { color: '#3dd598', weight: 2, dashArray: '5, 5' }).addTo(map);
    let currentLat = 20.5888, currentLng = -100.3898;

    let simulatorInterval = null;

    function toggleSimulator() {
      const btn = document.getElementById('btnStart');
      const status = document.getElementById('wsStatus');

      if (simulatorInterval) {
        clearInterval(simulatorInterval);
        simulatorInterval = null;
        btn.textContent = 'INICIAR SIMULADOR';
        btn.className = 'btn btn-primary';
        status.textContent = 'DETENIDO';
        status.style.background = 'rgba(122, 134, 158, 0.15)';
        status.style.color = 'var(--text-muted)';
      } else {
        btn.textContent = 'DETENER SIMULADOR';
        btn.className = 'btn btn-danger';
        status.textContent = 'EN LÍNEA';
        status.style.background = 'rgba(61,213,152,0.15)';
        status.style.color = 'var(--neon-green)';

        simulatorInterval = setInterval(() => {
          const data = generateSimulatedData();
          saveRecordToDB(data);
          document.getElementById('liveData').textContent = data.raw;

          currentLat += (Math.random() - 0.5) * 0.002;
          currentLng += (Math.random() - 0.5) * 0.002;
          document.getElementById('coordLat').textContent = currentLat.toFixed(4);
          document.getElementById('coordLng').textContent = currentLng.toFixed(4);

          let newPos = [currentLat, currentLng];
          marker.setLatLng(newPos);
          latlngs.push(newPos);
          path.setLatLngs(latlngs);

          if (!document.getElementById('tab-map').classList.contains('hidden')) {
            map.panTo(newPos, { animate: true, duration: 1 });
          }
        }, 2000);
      }
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.container > div[id^="tab-"]').forEach(d => d.classList.add('hidden'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');

      if (tabId === 'map') setTimeout(() => map.invalidateSize(), 100);
      if (tabId === 'charts') drawChart();
      if (tabId === 'db') renderDB();
    }

    initDB();
  </script>
</body>

</html>
