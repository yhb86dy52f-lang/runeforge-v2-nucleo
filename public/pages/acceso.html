<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runeforge - Acceso iPhone</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 flex flex-col items-center justify-center min-h-screen bg-[#0D0211] text-[#E2D6EE]">
    <div class="max-w-md w-full bg-[#15051C] p-6 rounded-2xl border border-[#39FF14]/30 text-center">
        <h1 class="text-2xl font-bold text-[#39FF14] mb-2">⚡ Runeforge AI - iPhone</h1>
        <p class="text-sm text-gray-400 mb-6">Escanea el código QR con la cámara de tu iPhone para entrar.</p>
        <div class="space-y-6">            <div class="bg-[#0D0211] p-4 rounded-xl border border-[#BD00FF]/40 flex flex-col items-center">
                <span class="text-xs font-bold text-[#BD00FF] uppercase mb-3">Wi-Fi Local (Misma red de casa)</span>
                <div class="bg-[#39FF14] p-3 rounded-xl shadow-lg">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=http%3a%2f%2f192.168.100.8%3a3100%2f&color=0D0211&bgcolor=39FF14" alt="QR Code" class="w-48 h-48 rounded-lg block" />
                </div>
                <a href="http://192.168.100.8:3100/" target="_blank" class="text-xs text-[#39FF14] underline break-all mt-3 font-mono font-bold">http://192.168.100.8:3100/forge</a>
            </div>            <div class="bg-[#0D0211] p-4 rounded-xl border border-[#BD00FF]/40 flex flex-col items-center">
                <span class="text-xs font-bold text-[#BD00FF] uppercase mb-3">Tailscale VPN (Datos móviles / Fuera)</span>
                <div class="bg-[#39FF14] p-3 rounded-xl shadow-lg">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=http%3a%2f%2f100.111.32.10%3a3100%2f&color=0D0211&bgcolor=39FF14" alt="QR Code" class="w-48 h-48 rounded-lg block" />
                </div>
                <a href="http://100.111.32.10:3100/" target="_blank" class="text-xs text-[#39FF14] underline break-all mt-3 font-mono font-bold">http://100.111.32.10:3100/forge</a>
            </div>        </div>
    </div>
<!-- v2.3 QR Dinamico -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<div id="qr-v23" style="display:flex;gap:20px;flex-wrap:wrap;margin:15px 0;">
  <div><h3>📱 WiFi Local (Auto)</h3><div id="qrcode-local"></div><p id="url-local"></p></div>
  <div><h3>🌐 Tailscale VPN (Auto)</h3><div id="qrcode-ts"></div><p id="url-ts"></p></div>
</div>
<script>
(async()=>{
  try{
    const r=await fetch('/api/network'); const j=await r.json();
    const localUrl=j.forge_local || `http://${location.hostname}:3100/forge`;
    const tsUrl=j.forge_tailscale || localUrl;
    document.getElementById('url-local').innerText=localUrl;
    document.getElementById('url-ts').innerText=tsUrl;
    new QRCode(document.getElementById('qrcode-local'),{text:localUrl,width:180,height:180});
    new QRCode(document.getElementById('qrcode-ts'),{text:tsUrl,width:180,height:180});
  }catch(e){
    console.log('v2.3 QR fallback',e);
    const fallback=`http://${location.hostname}:3100/forge`;
    new QRCode(document.getElementById('qrcode-local'),{text:fallback,width:180,height:180});
  }
})();
</script>
</body>
</html>
