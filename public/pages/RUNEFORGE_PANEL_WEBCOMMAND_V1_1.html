<!doctype html><html lang="es"><head><meta charset="utf-8"><title>RUNEFORGE WebCommand</title><style>body{background:#0d0211;color:#39ff14;font-family:Consolas,monospace;padding:20px}button{background:#160020;color:#39ff14;border:1px solid #39ff14;padding:12px;margin:6px;border-radius:8px;cursor:pointer}pre{background:#050006;border:1px solid #39ff14;padding:12px;white-space:pre-wrap}</style></head><body><h1>RUNEFORGE // WEBCOMMAND V1.1</h1><p id="state">Verificando...</p><button onclick="run('status')">Status</button><button onclick="run('pm2-health')">PM2 Health</button><button onclick="run('package')">Package</button><button onclick="run('src-tree')">SRC Tree</button><button onclick="run('backend-root')">Backend Root</button><pre id="log"></pre><script>const log=document.getElementById("log");const state=document.getElementById("state");function out(x){log.textContent+="\n"+JSON.stringify(x,null,2)}async function health(){try{const r=await fetch("/api/webcommand/health");const j=await r.json();state.textContent=j.ok?"Endpoint OK":"Endpoint ERROR";out({health:j})}catch(e){state.textContent="Endpoint no disponible";out({error:e.message})}}async function run(action){try{const r=await fetch("/api/webcommand",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action})});const j=await r.json();out({action,response:j})}catch(e){out({action,error:e.message})}}health();</script></body></html>
