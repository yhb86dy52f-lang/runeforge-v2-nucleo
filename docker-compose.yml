services:
  runeforge-ntfy:
    image: binwiederhier/ntfy:latest
    container_name: runeforge-ntfy
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./ntfy-cache:/var/cache/ntfy
      - ./ntfy-config:/etc/ntfy
    command: serve

