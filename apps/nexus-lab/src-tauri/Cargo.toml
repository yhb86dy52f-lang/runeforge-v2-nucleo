[package]
name = "nexus-lab"
version = "1.0.0"
description = "NEXUS LAB - ESP32 Circuit Designer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexus_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

