<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORGE SMS-HUB</title>
<style>
  :root{
    --bg:#08090f;--panel:#0f1119;--panel2:#131620;--border:#1e2230;
    --text:#e4e6eb;--dim:#8b90a0;--accent:#00f5ff;--accent2:#a78bfa;
    --ok:#10b981;--warn:#f59e0b;--err:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:14px;min-height:100vh}
  .mono{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace}
  header{
    padding:14px 20px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel);position:sticky;top:0;z-index:10;
  }
  header h1{margin:0;font-size:15px;letter-spacing:.15em;font-weight:700}
  header h1 span{color:var(--accent)}
  .status{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--err);box-shadow:0 0 8px var(--err)}
  main{max-width:1400px;margin:0 auto;padding:20px;display:grid;
    grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:16px}
  .panel h2{margin:0 0 14px;font-size:11px;letter-spacing:.18em;
    color:var(--dim);font-weight:600;text-transform:uppercase}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 14px;border-radius:8px;cursor:pointer;font-size:13px;
    font-family:inherit;transition:all .15s;font-weight:500;
  }
  button:hover{background:#1a1e2c;border-color:#2a3040}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.on{background:rgba(16,185,129,.15);border-color:var(--ok);color:var(--ok)}
  button.off{background:rgba(239,68,68,.15);border-color:var(--err);color:var(--err)}
  button.special{background:rgba(167,139,250,.15);border-color:var(--accent2);color:var(--accent2)}
  button.primary{background:var(--accent);color:#08090f;border-color:var(--accent)}
  button.primary:hover{background:#4dd6ef}
  .section{margin-bottom:20px}
  .section:last-child{margin-bottom:0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{font-size:10px;letter-spacing:.15em;color:var(--dim);font-weight:600;
    text-transform:uppercase}
  tr:hover td{background:var(--panel2)}
  .log{background:#05060a;border-radius:8px;padding:12px;font-family:ui-monospace,monospace;
    font-size:12px;line-height:1.6;height:340px;overflow-y:auto;border:1px solid var(--border)}
  .log-entry{margin-bottom:4px}
  .log-entry .ts{color:var(--dim);margin-right:8px}
  .log-entry.ok{color:var(--ok)}
  .log-entry.err{color:var(--err)}
  .log-entry.info{color:var(--accent)}
  .log-entry.warn{color:var(--warn)}
  textarea{
    width:100%;background:#05060a;border:1px solid var(--border);color:var(--text);
    padding:10px;border-radius:8px;font-family:ui-monospace,monospace;font-size:12px;
    min-height:120px;resize:vertical;
  }
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;
    letter-spacing:.1em;font-weight:600}
  .badge.ok{background:rgba(16,185,129,.15);color:var(--ok)}
  .badge.err{background:rgba(239,68,68,.15);color:var(--err)}
  .badge.pending{background:rgba(245,158,11,.15);color:var(--warn)}
  .empty{color:var(--dim);text-align:center;padding:24px;font-style:italic}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#2a3040;border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  .muted{color:var(--dim);font-size:12px}
  .kbd{background:#1a1e2c;padding:2px 6px;border-radius:4px;font-family:monospace;
    font-size:11px;border:1px solid var(--border)}
</style>
</head>
<body>

<header>
  <h1>⚡ FORGE <span>SMS-HUB</span></h1>
  <div class="status">
    <span><span class="dot off" id="statusDot"></span><span id="statusTxt">Conectando...</span></span>
    <span class="mono" id="adapterTxt">adapter: —</span>
    <span class="mono">v1.1</span>
  </div>
</header>

<main>

  <!-- Columna izquierda: acciones + flota -->
  <div>
    <div class="panel section">
      <h2>Acciones</h2>
      <div class="row">
        <button class="primary" onclick="refreshAll()">↻ Refrescar flota</button>
        <button onclick="diagAll()">🩺 Diagnóstico masivo</button>
      </div>
      <div class="row">
        <button onclick="openImport()">📥 Importar CSV</button>
        <button onclick="exportCsv()">📤 Exportar CSV</button>
      </div>
    </div>

    <div class="panel section">
      <h2>Paros individuales</h2>
      <div class="row">
        <button class="on"  onclick="paro('on',0)">🔴 PARO 1 ON</button>
        <button class="off" onclick="paro('off',0)">✓ PARO 1 OFF</button>
      </div>
      <div class="row">
        <button class="on"  onclick="paro('on',1)">🔴 PARO 2 ON</button>
        <button class="off" onclick="paro('off',1)">✓ PARO 2 OFF</button>
      </div>
      <div class="row">
        <button class="on"  onclick="paro('on',2)">🔴 PARO 3 ON</button>
        <button class="off" onclick="paro('off',2)">✓ PARO 3 OFF</button>
      </div>
    </div>

    <div class="panel section">
      <h2>⭐ Paro Especial 1+3 (AND hardware)</h2>
      <div class="row">
        <button class="special" onclick="paroEspecial('on')">⚡ ACTIVAR ESPECIAL 1+3</button>
        <button class="off"     onclick="paroEspecial('off')">✓ QUITAR ESPECIAL 1+3</button>
      </div>
      <p class="muted">Envía <span class="kbd">!R3,8,0</span> + <span class="kbd">!R3,8,2</span> para activar el relay maestro (AND)</p>
    </div>

    <div class="panel section">
      <h2>Flota (<span id="fleetCount">0</span>)</h2>
      <div id="fleetTable"><div class="empty">Cargando...</div></div>
    </div>
  </div>

  <!-- Columna derecha: log + importar -->
  <div>
    <div class="panel section">
      <h2>Log de actividad</h2>
      <div class="log" id="log"></div>
      <div class="row" style="margin-top:12px;margin-bottom:0">
        <button onclick="clearLog()">Limpiar log</button>
        <button onclick="copyLog()">Copiar log</button>
      </div>
    </div>

    <div class="panel section" id="importPanel" style="display:none">
      <h2>Importar CSV</h2>
      <p class="muted">Formato: <span class="kbd">unidad,numero,ip</span> (ip opcional)</p>
      <textarea id="csvInput" placeholder="unidad,numero,ip&#10;485,8711085271,&#10;486,8711085272,"></textarea>
      <div class="row" style="margin-top:12px;margin-bottom:0">
        <button class="primary" onclick="doImport()">Importar</button>
        <button onclick="closeImport()">Cancelar</button>
      </div>
    </div>
  </div>

</main>

<script>
const API = 'http://127.0.0.1:8080';

function log(msg, kind='info') {
  const el = document.getElementById('log');
  const ts = new Date().toLocaleTimeString('es-MX', {hour12:false});
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + kind;
  entry.innerHTML = '<span class="ts">[' + ts + ']</span>' + msg;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }
function copyLog() {
  const txt = document.getElementById('log').innerText;
  navigator.clipboard.writeText(txt).then(()=>log('Log copiado al portapapeles','ok'));
}

async function api(path, opts={}) {
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

async function checkHealth() {
  try {
    const h = await api('/api/health');
    document.getElementById('statusDot').className = 'dot on';
    document.getElementById('statusTxt').textContent = 'BACKEND OK';
    document.getElementById('adapterTxt').textContent = 'adapter: ' + h.adapter;
    return true;
  } catch(e) {
    document.getElementById('statusDot').className = 'dot off';
    document.getElementById('statusTxt').textContent = 'BACKEND OFFLINE';
    document.getElementById('adapterTxt').textContent = 'adapter: —';
    return false;
  }
}

async function loadFleet() {
  try {
    const r = await api('/api/fleet/list');
    const units = r.units || [];
    document.getElementById('fleetCount').textContent = units.length;
    const t = document.getElementById('fleetTable');
    if (units.length === 0) {
      t.innerHTML = '<div class="empty">Sin unidades. Importa un CSV para empezar.</div>';
      return;
    }
    let html = '<table><thead><tr><th>Unidad</th><th>Número</th><th>Estado</th></tr></thead><tbody>';
    for (const u of units) {
      const badge = u.estatus ? '<span class="badge ok">' + u.estatus + '</span>'
                              : '<span class="badge pending">—</span>';
      html += '<tr><td class="mono">' + (u.unidad||'') + '</td>'
            + '<td class="mono">' + (u.numero||'') + '</td>'
            + '<td>' + badge + '</td></tr>';
    }
    html += '</tbody></table>';
    t.innerHTML = html;
  } catch(e) {
    log('Error cargando flota: ' + e.message, 'err');
  }
}

async function refreshAll() {
  log('Refrescando estado...', 'info');
  await checkHealth();
  await loadFleet();
}

async function diagAll() {
  log('Diagnóstico masivo → !R0 + !R5', 'info');
  try {
    const r = await api('/api/fleet/diag', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({target: null})
    });
    const n = r.results.length;
    const okN = r.results.filter(x=>x.r0 && x.r5).length;
    log('Diagnóstico: ' + okN + '/' + n + ' respondieron OK', okN===n?'ok':'warn');
  } catch(e) {
    log('Error diagnóstico: ' + e.message, 'err');
  }
}

async function paro(action, slot) {
  log('Paro ' + action.toUpperCase() + ' slot ' + slot + ' (masivo)', 'info');
  try {
    const r = await api('/api/fleet/paro', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action, slot, masivo: true})
    });
    const okN = r.results.filter(x=>x.ok).length;
    log('Enviado ' + r.command + ' → ' + okN + '/' + r.results.length + ' OK', okN===r.results.length?'ok':'warn');
  } catch(e) {
    log('Error paro: ' + e.message, 'err');
  }
}

async function paroEspecial(action) {
  log('Paro ESPECIAL 1+3 ' + action.toUpperCase() + ' (masivo, AND)', 'info');
  try {
    const r = await api('/api/fleet/paro-especial', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action, masivo: true})
    });
    const okN = r.results.filter(x=>x.ok1 && x.ok2).length;
    log('Especial ' + r.command + ' → ' + okN + '/' + r.results.length + ' OK', okN===r.results.length?'ok':'warn');
  } catch(e) {
    log('Error especial: ' + e.message, 'err');
  }
}

function openImport() { document.getElementById('importPanel').style.display = 'block'; }
function closeImport() { document.getElementById('importPanel').style.display = 'none'; }

async function doImport() {
  const csv = document.getElementById('csvInput').value.trim();
  if (!csv) return;
  log('Importando CSV...', 'info');
  try {
    const r = await api('/api/fleet/import-csv', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({csv, default_ip: '94.130.84.182'})
    });
    log('Importado: ' + r.inserted + ' nuevas, ' + r.skipped + ' saltadas', 'ok');
    closeImport();
    await loadFleet();
  } catch(e) {
    log('Error import: ' + e.message, 'err');
  }
}

async function exportCsv() {
  log('Exportando CSV...', 'info');
  try {
    const txt = await api('/api/fleet/export-csv');
    const blob = new Blob([txt], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'unidades_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    log('CSV descargado', 'ok');
  } catch(e) {
    log('Error export: ' + e.message, 'err');
  }
}

// Boot
log('FORGE SMS-HUB HMI iniciada', 'info');
checkHealth().then(ok => {
  if (ok) {
    log('Backend conectado en ' + API, 'ok');
    loadFleet();
  } else {
    log('Backend no responde. Verifica que uvicorn esté activo.', 'err');
  }
});

// Health check cada 15s
setInterval(checkHealth, 15000);
</script>

</body>
</html>
