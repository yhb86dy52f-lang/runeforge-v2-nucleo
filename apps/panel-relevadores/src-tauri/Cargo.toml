[package]
name = "panel-relevadores"
version = "1.0.0"
description = "NEXUS LAB - ESP32 Relay Studio - RUNEFORGE Canon v1.0"
edition = "2021"

[lib]
name = "panel_relevadores_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


