[package]
name = "openwash-real-v2"
version = "1.0.0"
description = "Openwash Real v2 - RUNEFORGE Canon v1.0"
edition = "2021"

[lib]
name = "openwash_real_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"



