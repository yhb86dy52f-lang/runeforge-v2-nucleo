        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;800&display=swap');
        :root{
          --bg:#06090e;
          --panel:#0c121e;
          --panel-2:#0f172a;
          --border:rgba(255,255,255,0.08);
          --cyan:#06b6d4;
          --emerald:#10b981;
          --rose:#f43f5e;
          --text:#e2e8f0;
          --muted:#64748b;
        }
        *{box-sizing:border-box}
        html,body{margin:0;background:var(--bg);color:var(--text);font-family:JetBrains Mono, monospace; -webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100%}
        h1,h2{font-family:Syne, sans-serif}
        .app{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden; width:100%; max-width:100%; }
        .app::before{
          content:"";position:fixed;inset:0;pointer-events:none;
          background:
            radial-gradient(600px at 20% -10%, rgba(6,182,212,0.18), transparent 60%),
            radial-gradient(800px at 90% 10%, rgba(16,185,129,0.12), transparent 60%),
            radial-gradient(500px at 50% 100%, rgba(244,63,94,0.08), transparent 70%);
          z-index:0;
        }
        header{
          position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;
          padding:12px 18px;border-bottom:1px solid var(--border);
          background:rgba(6,9,14,0.84);backdrop-filter:blur(12px);
        }
        .logo{
          display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:0.02em;
        }
        .logo-mark{
          width:34px;height:34px;border-radius:9px;
          background:conic-gradient(from 180deg, var(--cyan), #0ea5e9, var(--emerald), var(--cyan));
          display:grid;place-items:center;box-shadow:0 0 22px rgba(6,182,212,0.5);
        }
        .logo-mark span{width:22px;height:22px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:13px}
        .logo-title{font-family:Syne; font-size:18px; line-height:1}
        .logo-title b{color:var(--cyan)}
        .logo-sub{font-size:10px;color:var(--muted);letter-spacing:0.18em}
        .chip{
          margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap
        }
        .chip-item{
          padding:6px 10px;border-radius:999px;border:1px solid var(--border);
          background:rgba(255,255,255,0.03);font-size:11px;display:flex;gap:6px;align-items:center
        }
        .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 8px currentColor}
        .dot.off{background:var(--muted);box-shadow:none}
        .dot.cyan{background:var(--cyan)}
        .btn{
          appearance:none;border:1px solid var(--border);background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
          color:var(--text);padding:9px 14px;border-radius:10px;font:600 11px JetBrains Mono;letter-spacing:0.08em;
          cursor:pointer;transition:transform .12s, border-color .2s, box-shadow .2s, background .2s;will-change:transform;
        }
        .btn:active{transform:scale(0.98)}
        .btn:hover{border-color:rgba(6,182,212,0.4);box-shadow:0 0 0 3px rgba(6,182,212,0.12)}
        .btn.primary{background:linear-gradient(180deg, rgba(6,182,212,0.28), rgba(6,182,212,0.12)); border-color:rgba(6,182,212,0.5);color:#e0faff}
        .btn.rose{border-color:rgba(244,63,94,0.4)}
        .btn.rose:hover{box-shadow:0 0 0 3px rgba(244,63,94,0.15)}
        .btn.ghost{background:transparent}
        .dashboard-grid{
          display:grid;grid-template-columns:300px minmax(0, 1.15fr) minmax(0,380px);grid-template-rows:auto 160px;
          gap:14px;padding:14px;position:relative;z-index:1;max-width:1720px;width:100%;margin:0 auto;overflow:hidden;box-sizing:border-box;
        }
        @media(max-width:1280px){.dashboard-grid{grid-template-columns:280px 1fr;grid-template-rows:auto auto 160px} .devices{grid-column:1 / -1} .heatmap{grid-column:1 / -1}}
        @media(max-width:780px){.dashboard-grid{grid-template-columns:1fr; } header{flex-wrap:wrap} .chip{margin-left:0;width:100%}}
        .panel{
          background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
          border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(12px);
          box-shadow:0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
          contain:layout style paint;
          min-width:0; overflow:hidden;
        }
        .stats{display:flex;flex-direction:column;gap:12px}
        .card{padding:14px}
        .card h3{font-size:11px;letter-spacing:0.18em;color:var(--muted);margin:0 0 10px}
        .kv{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:12px}
        .kv span:first-child{color:var(--muted)}
        .kv b{font-weight:600}
        .rssi-bar{height:4px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:6px}
        .rssi-fill{height:100%;background:linear-gradient(90deg, var(--cyan), var(--emerald));transition:width .6s}

        .family-row .fill{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
        .family-row .count{font-size:11px;color:var(--muted);min-width:18px;text-align:right}

        .radar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

        .legend{display:flex;gap:8px;flex-wrap:wrap}

        .legend-dot{width:8px;height:8px;border-radius:50%}

        .devices{padding:0;display:flex;flex-direction:column;overflow:hidden;min-width:0}
        .devices-head{padding:12px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}
        .devices-head input, .devices-head select{
          background:rgba(0,0,0,0.35);border:1px solid var(--border);color:var(--text);

        }
        .devices-head input{flex:1;min-width:120px}
        .table-wrap{overflow:auto;flex:1;max-height:520px;scrollbar-width:thin;max-width:100%}
        table{width:100%;border-collapse:collapse;font-size:11px}
        thead{position:sticky;top:0;background:rgba(12,18,30,0.92);backdrop-filter:blur(8px);z-index:1}
        th{padding:10px 8px;text-align:left;color:var(--muted);font-weight:600;letter-spacing:0.06em;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
        td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,0.04);white-space:nowrap}
        tr:hover td{background:rgba(6,182,212,0.06);transform:translateX(2px);transition:transform .12s, background .12s}
        .badge{padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:0.06em;border:1px solid transparent}
        .rssi-cell{display:flex;align-items:center;gap:6px}
        .rssi-mini{width:36px;height:4px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden}
        .rssi-mini-fill{height:100%}
        .vivo{color:var(--emerald)} .muerto{color:var(--muted)}
        .heatmap{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;overflow:hidden;padding:0;max-width:100%}
        @media(max-width:900px){.heatmap{grid-template-columns:1fr}}
        .heatmap-left{padding:12px}
        .heatmap-left h3{font-size:11px;letter-spacing:0.18em;color:var(--muted);margin:0 0 8px}
        #heatmap{width:100%;height:120px;border-radius:10px;display:block;background:#080c14}
        .threat{border-left:1px solid var(--border);padding:12px;max-height:160px;overflow:auto}
        .threat h3{font-size:11px;letter-spacing:0.18em;color:var(--muted);margin:0 0 8px}
        .log-item{font-size:11px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,0.06);display:flex;gap:8px}
        .log-time{color:var(--muted);min-width:52px}
        .log-msg{flex:1}
        .log-item.crit .log-msg{color:#fecdd3}
        .log-item.warn .log-msg{color:#fde68a}
        #inspector{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px)}
        #inspector[hidden]{display:none!important}
        .inspector-card{width:min(560px,92vw);background:linear-gradient(180deg, rgba(20,30,50,0.92), rgba(10,14,22,0.96));border:1px solid rgba(6,182,212,0.25);border-radius:18px;padding:18px;box-shadow:0 20px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(6,182,212,0.15) inset}
        .inspector-card h2{margin:0 0 6px;font-size:16px}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
        .kv-big{padding:10px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border)}
        .kv-big small{color:var(--muted);font-size:10px;letter-spacing:0.12em;display:block;margin-bottom:4px}
        .kalman-vis{margin-top:14px;padding:12px;border-radius:12px;background:rgba(0,0,0,0.35);border:1px solid var(--border)}
        .kalman-bar{height:8px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;position:relative;margin:6px 0}
        .kalman-bar .raw{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,0.25)}
        .kalman-bar .kal{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg, var(--cyan), var(--emerald))}
        .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;background:rgba(12,18,30,0.92);border:1px solid rgba(6,182,212,0.4);color:var(--text);padding:10px 16px;border-radius:999px;font:600 11px JetBrains Mono;backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,0.5), 0 0 0 3px rgba(6,182,212,0.15);pointer-events:none;animation:toastIn .25s ease}
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)}}
